[server]
origin = "knolastna.me"
hostname = "knolastna.me"
data_dir = "./data"
boards_dir = "./boards"
events_bodies_dir = "./event_bodies"
port = 2272
# admin_pubkey = "<hex-encoded Ed25519 public key for full access>"

[limits]
max_request_size = 10485760
max_article_body_size = 1048576
rate_limit_requests = 100
rate_limit_window = 1

[search]
max_count = 1000
timeout_seconds = 10
result_limit = 100

[tls]
enabled = true
cert_path = "./knolastna.me.pem"
key_path = "./knolastna.me.key"
ca_bundle = true

[sync]
interval_seconds = 300

