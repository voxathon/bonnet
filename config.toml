[server]
origin = "knolastna.me"
hostname = "knolastna.me"
data_dir = "./data"
boards_dir = "./boards"
events_bodies_dir = "./event_bodies"
port = 2272
# admin_pubkey = "<hex-encoded Ed25519 public key for full access>"

[limits]
max_request_size = 10485760
max_article_body_size = 1048576
rate_limit_requests = 100
rate_limit_window = 1

[search]
max_count = 1000
timeout_seconds = 10
result_limit = 100

[tls]
enabled = true
cert_path = "./knolastna.me.pem"
key_path = "./knolastna.me.key"
ca_bundle = true

[sync]
interval_seconds = 300

# ACL rules (PROTOCOL.md §16): explicit deny-wins, conjunctive dimensions.
# Supported matchers: pubkey, role, origin, anonymous, unknown, wildcard.
# Selector lists: commands, kinds, boards, objects. Omit = not granted. "*" = all.

# Admin full access (uncomment and set your server's pubkey)
[[acl]]
effect = "allow"
match.pubkey = "hex:dddf572692b2b655d520959fa6ebefdd141a6cfe8fc0fd3236b521ddf4b1edf8"
actions = ["read", "write"]
commands = ["*"]
kinds = ["*"]
boards = ["*"]
objects = ["*"]

[[acl]]
effect = "allow"
match.role = "moderator"
actions = ["write"]
commands = ["PUBLISH_RECORD"]
kinds = ["bonnet.article.cancel", "bonnet.article.restore", "bonnet.article.purge", "bonnet.article.pin", "bonnet.article.unpin", "bonnet.thread.close", "bonnet.thread.reopen", "bonnet.report", "bonnet.rule.publish", "bonnet.rule.revoke", "bonnet.punishment.issue", "bonnet.punishment.revoke"]
boards = ["*"]

# Anonymous: read-only
[[acl]]
effect = "allow"
match.anonymous = true
actions = ["read"]
commands = ["EVENT_HEAD", "EVENT_RANGE", "EVENT_GET", "BOARD_LIST", "ARTICLE_GET", "ARTICLE_LIST", "ARTICLE_SEARCH", "ARTICLE_QUERY", "ARTICLE_BODY", "USER_GET", "USER_LIST", "BAN_STATUS", "EVENT_BODY"]
boards = ["*"]
objects = ["*"]

# Anonymous: no writes
[[acl]]
effect = "deny"
match.anonymous = true
actions = ["write"]
commands = ["PUBLISH_RECORD"]

# Unknown (not registered): denied all writes except registration
[[acl]]
effect = "deny"
match.unknown = true
actions = ["write"]
kinds = ["bonnet.article", "bonnet.article.cancel", "bonnet.article.restore", "bonnet.article.purge", "bonnet.article.pin", "bonnet.article.unpin", "bonnet.thread.close", "bonnet.thread.reopen", "bonnet.board.create", "bonnet.board.close", "bonnet.board.reopen", "bonnet.rule.publish", "bonnet.rule.revoke", "bonnet.report", "bonnet.punishment.issue", "bonnet.punishment.revoke", "bonnet.origin.key.rotate"]

# Unknown: can register themselves
[[acl]]
effect = "allow"
match.unknown = true
actions = ["write"]
commands = ["PUBLISH_RECORD"]
kinds = ["bonnet.user.register"]
boards = ["*"]

# Authenticated users: can publish articles, register, cancel/restore/purge own articles
[[acl]]
effect = "allow"
match.wildcard = true
actions = ["write"]
commands = ["PUBLISH_RECORD"]
kinds = ["bonnet.article", "bonnet.user.register", "bonnet.article.cancel", "bonnet.article.restore", "bonnet.article.purge"]
boards = ["*"]

# Authenticated users: read everything
[[acl]]
effect = "allow"
match.wildcard = true
actions = ["read"]
commands = ["*"]
boards = ["*"]
objects = ["*"]
