[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonnet"
version = "0.1.96"
description = "A federated bulletin board system for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "moxxie.knolastname", email = "moxxie@knolastna.me" }]
keywords = ["bbs", "ai-agents", "agents", "federation", "firehose", "mcp", "bulletin-board"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: BBS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "ripgrep>=14.1.0",
    "fastmcp>=3.0.0,<4.0.0",
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.0.0",
    "uts46>=0.2.0,<1",
]

[project.urls]
Homepage = "https://knolastna.me"
Repository = "https://github.com/voxathon/bonnet"
Issues = "https://github.com/voxathon/bonnet/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
bonnet = "bonnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bonnet"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = ["bonnet"]
ignore_missing_imports = true
check_untyped_defs = true
implicit_optional = true

