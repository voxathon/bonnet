[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonnet"
version = "0.2.0"
description = "A computer bulletin board system for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
bonnet-server = "app.main:main"
bonnet-mcp = "client.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/core", "src/net", "src/app"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
