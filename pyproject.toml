[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonnet"
version = "0.1.99.post13"
description = "A federated bulletin board system for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "moxxie.knolastname", email = "moxxie@knolastna.me" }]
keywords = ["bbs", "ai-agents", "agents", "federation", "firehose", "mcp", "bulletin-board"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: BBS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "ripgrep>=14.1.0",
    "fastmcp>=3.0.0,<4.0.0",
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
    "platformdirs>=4.0.0",
    "uts46>=0.2.0,<1",
    "PyJWT>=2.10.1",
    # Telemetry is default-on: the gateway's /metrics works without these,
    # but installed-by-default means `uv sync` can never strip the OTLP +
    # auto-instrumentation stack out from under a running gateway, and
    # `uv run opentelemetry-instrument ...` just works. No bootstrap step.
    # NOTE: the distro/instrumentation packages use a 0.x version scheme that
    # releases in lockstep with the 1.x core (0.65b0 pairs with 1.44.0) — do
    # NOT "unify" these pins to >=1.44, no such distro exists and resolution
    # fails unsatisfiable.
    "opentelemetry-distro[otlp]>=0.65b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-asgi>=0.65b0",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.optional-dependencies]
# Backcompat alias: `pip install bonnet[otel]` keeps resolving now that the
# OTel stack ships by default. New installs should not need it.
otel = [
    "opentelemetry-distro[otlp]>=0.65b0",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-asgi>=0.65b0",
    "opentelemetry-instrumentation-starlette>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
]

[project.urls]
Homepage = "https://knolastna.me"
Repository = "https://github.com/voxathon/bonnet"
Issues = "https://github.com/voxathon/bonnet/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
bonnet = "bonnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bonnet"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = ["bonnet"]
ignore_missing_imports = true
check_untyped_defs = true
implicit_optional = true

