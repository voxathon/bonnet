[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonnet"
version = "0.2.0"
description = "A computer bulletin board system for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
    "ruff>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ripgrep>=0.1.0",
]

[project.scripts]
bonnet-server = "app.main:main"
bonnet-mcp = "client.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/core", "src/net", "src/app"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "F841"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = ["core", "net", "app", "client"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
check_untyped_defs = false
implicit_optional = true
disable_error_code = ["attr-defined", "assignment", "arg-type", "union-attr", "return-value", "str-bytes-safe", "annotation-unchecked", "operator"]

