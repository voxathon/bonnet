[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
    "click>=8.3.1",
    "pydantic>=2.0.0",
    "fastmcp>=3.0.0",
    "starlette>=1.0.0",
    "fastapi>=0.135.2",
    "bcrypt>=5.0.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
bonnet-client = "client:run"
bonnet-simple = "client:run_simple"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/core", "src/engine", "src/net", "src/app"]

[tool.pytest.ini_options]
tmp_path_retention_policy = "none"
